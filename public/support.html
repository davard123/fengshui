<body><main><h1>九宫风水 · 支持</h1>
<h2>常见问题</h2>
<p><b>罗盘读数不准？</b> 手机平放并远离铁门、冰箱、汽车等金属物 1 米以上；读数跳动时拿手机在空中画几次「8」字校准。</p>
<p><b>地图上找不到我的房子？</b> 在第 1 步可以沿房屋外墙手动描出轮廓；住公寓的可以点「跳过地图，用罗盘定向」。</p>
<p><b>买了深度报告但没出来？</b> 已购买的报告可在报告页点「生成深度报告 / 重新生成」，不会重复收费。网络异常时会自动生成离线规则版报告。</p>
<p><b>换手机后记录没了？</b> 为保护隐私，所有资料只保存在本机，不做云端同步。</p>
